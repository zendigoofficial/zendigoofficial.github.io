<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flappy Face | Zendigo Arcade</title>
<link rel="stylesheet" href="style.css" />
</head>

<body>

<main class="page">

  <section class="game-shell">

    <header class="game-header">
      <div>
        <p class="eyebrow">UNAUTHORIZED BROADCAST MINI-GAME</p>
        <h1>Flappy Face</h1>
      </div>

      <a class="back-link" href="../../arcade-scores.html">Back To Arcade Scores →</a>
    </header>

    <div class="canvas-wrap">
      <canvas id="gameCanvas" width="960" height="540" aria-label="Flappy Face game canvas"></canvas>
    </div>

    <section class="info-panel">
      <div>
        <h2>How To Play</h2>
        <p>
          Press <strong>Space</strong>, click, or tap to flap. Avoid the signal gates.
          Keep the broadcast alive as long as possible.
        </p>
      </div>

      <div>
        <h2>Controls</h2>
        <p>
          <strong>Space</strong> / <strong>Click</strong> / <strong>Tap</strong> = Flap<br>
          <strong>R</strong> = Restart
        </p>
      </div>
    </section>

  </section>

</main>

<script src="game.js"></script>
</body>
</html>
